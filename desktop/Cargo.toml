[package]
name = "quire"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "A plain editor for folders of Markdown files."

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
# Rune comes from the fork overp0werj0int/rune, branch quire/dev: upstream origin/dev 1dba3423 plus
# eleven commits: what the per-line editor, its right-click menu and its hanging marks need
# (decision 0009), the edge scroll for a text field's drag selection, the Chrome-style touchpad
# fling (docs/reader-writer decision 0012), highlights painted on their own paragraph, with their
# letters under the mark on an indented line (find in source), and a modal that keeps chosen
# elements live to the pointer (the drawers' title bar).
# To try a Rune change before pushing it, add a [patch."https://github.com/overp0werj0int/rune"]
# section pointing rune and rune-highlights at a local checkout, and remove it before committing.
rune = { git = "https://github.com/overp0werj0int/rune", rev = "46afe7f9122d1a3e4426637b37ab2542d767fd41", default-features = false, features = ["accessibility", "dbus", "svg", "native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sync: HTTPS requests, request signing, and encryption before upload.
ureq = "2.12"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
getrandom = "0.2"
# The reader's Markdown parser (docs/reader-writer, phase 4).
pulldown-cmark = { version = "0.13", default-features = false }
# Code colours on the reader page (docs/reader-writer, phase 5): Rune's own lexers.
rune-highlights = { git = "https://github.com/overp0werj0int/rune", rev = "46afe7f9122d1a3e4426637b37ab2542d767fd41" }

[features]
# Phase timings (view, layout, text, paint) in the benches (`src/bench.rs`).
profile = ["rune/frame-profile"]

[build-dependencies]
embed-resource = "3"

# Rune builds these crates with its own changes. Cargo ignores a dependency's [patch]
# section, so the app repeats it here at the same Rune revision.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/overp0werj0int/rune", rev = "46afe7f9122d1a3e4426637b37ab2542d767fd41" }
# Rune's winit, plus file drops from other apps on Wayland (vendor/winit/src/platform_impl/linux/wayland/dnd.rs).
winit = { path = "vendor/winit" }
parley_engine = { git = "https://github.com/overp0werj0int/rune", rev = "46afe7f9122d1a3e4426637b37ab2542d767fd41" }
accesskit_windows = { git = "https://github.com/overp0werj0int/rune", rev = "46afe7f9122d1a3e4426637b37ab2542d767fd41" }
accesskit_macos = { git = "https://github.com/overp0werj0int/rune", rev = "46afe7f9122d1a3e4426637b37ab2542d767fd41" }

[profile.dev]
opt-level = 1

# Dependencies build at a low level and without debug info, so a debug build fits in a few
# gigabytes of memory. Debug builds run slower than release builds; measure in release.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
