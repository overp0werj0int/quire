[package]
name = "quire"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "A plain editor for folders of Markdown files."

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
# Rune comes from the fork overp0werj0int/rune, branch quire/dev: upstream origin/dev 2a1d6caf9
# (rebased 2026-11-26) plus the 7 commits Quire still needs and upstream does not have:
# 1. `El::modal_keeps` (a modal that leaves chosen elements live to the pointer, e.g. title bar),
# 2. field menus: caret moved before custom right-click menu, keyboard menu opened below caret
#    with its first item marked,
# 3. a long field's layout kept past the stale budget while another screen shows (editor back
#    from preview),
# 4. per-paragraph layout styles (`ParagraphStyle`, `El::paragraph_styles`) for hanging marks,
# 5. superscript spans (footnote numbers), bisector-joined and tapered strokes, and round joined
#    ends (the map's branches),
# 6. sliding glass focus cards (`Cx::focus_glass`) and `ElementInfo::stroke`,
# 7. Wayland Chrome-style touchpad fling (decision 0012), wheel event timestamps, and
#    `App::on_touchpad_hold` (the map stops its own coast when fingers land).
# Dropped at the 2026-11-26 rebase because upstream now handles them: drag-selection edge scroll,
# right-click outside a modal closing it, isolated-layer pipeline pre-warming, Phosphor pan
# cursors, caret follow after `on_input_key`, non-conformant Mesa Vulkan adapter fallback, and
# earlier by-paragraph/highlight fixes.
# To try a Rune change before pushing it, add a [patch."https://github.com/overp0werj0int/rune"]
# section pointing rune and rune-highlights at a local checkout, and remove it before committing.
rune = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9", default-features = false, features = ["dbus", "svg", "native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sync: HTTPS requests, request signing, and encryption before upload.
ureq = "2.12"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
getrandom = "0.2"
# The reader's Markdown parser (docs/reader-writer, phase 4).
pulldown-cmark = { version = "0.13", default-features = false }
# Code colours on the reader page (docs/reader-writer, phase 5): Rune's own lexers.
rune-highlights = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9" }

[features]
# Phase timings (view, layout, text, paint) in the benches (`src/bench.rs`).
profile = ["rune/frame-profile"]

[build-dependencies]
embed-resource = "3"

# Rune's long-field a11y selection encoding (`a11y/text.rs`, upstream 0796df5f / 3ef98871) is
# handled by its vendored macOS and Windows adapters, not Linux's unvendored `accesskit_unix`
# (`accesskit_consumer 0.39.2` panics at `text.rs:1533` on the first keystroke in an empty
# `text_input`). Keep `accessibility` off on Linux until Rune guards or patches Linux AT-SPI.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rune = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9", default-features = false, features = ["accessibility"] }

# Rune builds these crates with its own changes. Cargo ignores a dependency's [patch]
# section, so the app repeats it here at the same Rune revision.
[patch.crates-io]
naga = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9" }
wgpu-hal = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9" }
# Rune's winit, plus file drops from other apps and touchpad pinch on Wayland.
winit = { path = "vendor/winit" }
sctk-adwaita = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9" }
parley_engine = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9" }
accesskit_windows = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9" }
accesskit_macos = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9" }
accesskit_atspi_common = { git = "https://github.com/overp0werj0int/rune", rev = "84525f664e4c597cf6011109df88d1bf67d4f7a9" }

[profile.dev]
opt-level = 1
# Enough for a backtrace with file and line. Full debug info made the link and the binary bigger.
debug = "line-tables-only"

# Dependencies build at a low level and without debug info, so a debug build fits in a few
# gigabytes of memory. Debug builds run slower than release builds; measure in release.
[profile.dev.package."*"]
opt-level = 1
debug = false

# The fast loop (`./dev`, see that script): the crate being edited is unoptimized and keeps
# only line tables, for the shortest rebuild. It has its own folder, target/fast, so it never
# replaces target/debug/quire. `.cargo/fast.toml` adds what only a nightly toolchain accepts.
[profile.fast]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"

[profile.fast.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
