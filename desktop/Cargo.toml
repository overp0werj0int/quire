[package]
name = "quire"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "A plain editor for folders of Markdown files."

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6", default-features = false, features = ["accessibility", "dbus", "svg", "native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sync: HTTPS requests, request signing, and encryption before upload.
ureq = "2.12"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
getrandom = "0.2"
# The reader's Markdown parser (docs/reader-writer, phase 4).
pulldown-cmark = { version = "0.13", default-features = false }
# Code colours on the reader page (docs/reader-writer, phase 5): Rune's own lexers.
rune-highlights = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }

[features]
# Phase timings (view, layout, text, paint) in the benches (`src/bench.rs`).
profile = ["rune/frame-profile"]

[build-dependencies]
embed-resource = "3"

# The per-line editor and its right-click menu need Rune's fixes on the local branch quire/by-paragraph-fixes
# (~/Projects/rune-quire, commit a4034f05), which is not pushed yet, so this builds only where
# that checkout sits beside this one. Once it is pushed, pin its revision above and drop this.
[patch."https://github.com/anomalyco/rune"]
rune = { path = "../../rune-quire/crates/rune" }
rune-highlights = { path = "../../rune-quire/crates/rune-highlights" }

# Rune builds these crates with its own changes. Cargo ignores a dependency's [patch]
# section, so the app repeats it here at the same Rune revision.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }
# Rune's winit, plus file drops from other apps on Wayland (vendor/winit/src/platform_impl/linux/wayland/dnd.rs).
winit = { path = "vendor/winit" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "bf3f9d4a0459af5071cd352df816b610dda7f3a6" }

[profile.dev]
opt-level = 1

# Dependencies build at a low level and without debug info, so a debug build fits in a few
# gigabytes of memory. Debug builds run slower than release builds; measure in release.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
