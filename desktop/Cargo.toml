[package]
name = "quire"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "A plain editor for folders of Markdown files."

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
# Rune comes from the fork overp0werj0int/rune, branch quire/dev: upstream origin/dev 4a2e4379
# (merged 2026-11-18) plus what Quire needs and upstream does not have: paragraph styles for the
# per-line editor's hanging marks (decision 0009), a field's caret moved before its right-click
# menu opens, the keyboard menu opened below the caret with its first item marked, the edge
# scroll for a text field's drag selection, the Chrome-style touchpad fling (docs/reader-writer
# decision 0012), a modal that keeps chosen elements live to the pointer (the drawers' title
# bar), a right-click outside a modal closing it, a long field's layout kept while another screen
# shows (the editor back from the preview), the isolated layers' pipelines made on a thread
# before the first fade needs them, Phosphor-style pan cursors for middle-click autoscroll,
# caret following after `on_input_key` edits, and the app told when trackpad fingers land (the
# map stops its own coast there).
# Four earlier fork commits went at that merge because upstream now does their work: highlights
# on their own paragraph, a keyed highlight found in a by-paragraph field, letters coloured
# under a mark on an indented line, and the by-paragraph span lookup and blank-line fix.
# To try a Rune change before pushing it, add a [patch."https://github.com/overp0werj0int/rune"]
# section pointing rune and rune-highlights at a local checkout, and remove it before committing.
rune = { git = "https://github.com/overp0werj0int/rune", rev = "9bb10a375fd599fe788a8e65608b207bea77cf8e", default-features = false, features = ["dbus", "svg", "native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sync: HTTPS requests, request signing, and encryption before upload.
ureq = "2.12"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
getrandom = "0.2"
# The reader's Markdown parser (docs/reader-writer, phase 4).
pulldown-cmark = { version = "0.13", default-features = false }
# Code colours on the reader page (docs/reader-writer, phase 5): Rune's own lexers.
rune-highlights = { git = "https://github.com/overp0werj0int/rune", rev = "9bb10a375fd599fe788a8e65608b207bea77cf8e" }

[features]
# Phase timings (view, layout, text, paint) in the benches (`src/bench.rs`).
profile = ["rune/frame-profile"]

[build-dependencies]
embed-resource = "3"

# Rune's long-field a11y selection encoding (`a11y/text.rs`, upstream 0796df5f / 3ef98871) is
# handled by its vendored macOS and Windows adapters, not Linux's unvendored `accesskit_unix`
# (`accesskit_consumer 0.39.2` panics at `text.rs:1533` on the first keystroke in an empty
# `text_input`). Keep `accessibility` off on Linux until Rune guards or patches Linux AT-SPI.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rune = { git = "https://github.com/overp0werj0int/rune", rev = "9bb10a375fd599fe788a8e65608b207bea77cf8e", default-features = false, features = ["accessibility"] }

# Rune builds these crates with its own changes. Cargo ignores a dependency's [patch]
# section, so the app repeats it here at the same Rune revision.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/overp0werj0int/rune", rev = "9bb10a375fd599fe788a8e65608b207bea77cf8e" }
# Rune's winit, plus file drops from other apps on Wayland (vendor/winit/src/platform_impl/linux/wayland/dnd.rs).
winit = { path = "vendor/winit" }
parley_engine = { git = "https://github.com/overp0werj0int/rune", rev = "9bb10a375fd599fe788a8e65608b207bea77cf8e" }
accesskit_windows = { git = "https://github.com/overp0werj0int/rune", rev = "9bb10a375fd599fe788a8e65608b207bea77cf8e" }
accesskit_macos = { git = "https://github.com/overp0werj0int/rune", rev = "9bb10a375fd599fe788a8e65608b207bea77cf8e" }

[profile.dev]
opt-level = 1
# Enough for a backtrace with file and line. Full debug info made the link and the binary bigger.
debug = "line-tables-only"

# Dependencies build at a low level and without debug info, so a debug build fits in a few
# gigabytes of memory. Debug builds run slower than release builds; measure in release.
[profile.dev.package."*"]
opt-level = 1
debug = false

# The fast loop (`./dev`, see that script): the crate being edited is unoptimized and keeps
# only line tables, for the shortest rebuild. It has its own folder, target/fast, so it never
# replaces target/debug/quire. `.cargo/fast.toml` adds what only a nightly toolchain accepts.
[profile.fast]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"

[profile.fast.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
